<style>
html,body{margin:0;height:100%;background:#050507;overflow:hidden;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif}

.seg{position:absolute;right:28px;top:24px;display:flex;padding:4px;border-radius:999px;background:rgba(10,10,12,.62);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(8px)}

.seg div.on{color:#f6f4ef}

.tr{position:absolute;right:28px;top:24px;display:flex;gap:10px;align-items:center}
.seg{position:relative;right:auto;top:auto}

.luz svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;transition:all .35s}
.luz.on{color:#f6f4ef;background:rgba(40,30,18,.7);border-color:rgba(245,194,122,.45)}

.yo{position:absolute;left:28px;bottom:24px;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;border-radius:999px;background:rgba(10,10,12,.62);border:1px solid rgba(16,185,129,.35);backdrop-filter:blur(8px);color:#f3f1ec;font-size:14px;opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s}

<script type="module">
import * as THREE from 'three';

const W = innerWidth, H = innerHeight, PORTRAIT = W < H;
performance.mark('rc-ini');
const GYM = new URLSearchParams(location.search).has('gym');   // luces + la cámara entra al gimnasio
const CAM = new URLSearchParams(location.search).get('cam')?.split(',').map(Number);   // revisión: cámara fija x,y,z,lx,ly,lz,fov
const LUZ = GYM || new URLSearchParams(location.search).has('luz');   // muestra del interruptor: la cámara queda arriba y se prenden las luces
const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

RectAreaLightUniformsLib.init();
// three desenrolla el bucle de las RectAreaLight: en Windows (ANGLE sobre D3D) cada shader tardaba 3-9 s en compilar
// y la primera carga quedaba en negro varios minutos. Como bucle de verdad compila en ~1 s y da la misma imagen
// (mismo parche que components/office/office-scene.tsx en la app). Las LTC se leen con textureLod: no hay derivadas en un bucle.
THREE.ShaderChunk.lights_fragment_begin = THREE.ShaderChunk.lights_fragment_begin.replace(
  /#pragma unroll_loop_start\s*for \( int i = 0; i < NUM_RECT_AREA_LIGHTS; i \+\+ \) \{\s*rectAreaLight = rectAreaLights\[ i \];([\s\S]*?)#pragma unroll_loop_end/,
  'for ( int i = 0; i < min( NUM_RECT_AREA_LIGHTS, RC_N ); i ++ ) { rectAreaLight = rectAreaLights[ i ];' +
  // la oficina tiene 28 luces de techo y cada píxel las calculaba todas: se saltean las que desde ahí aportan menos del 1 % (intensidad × área / distancia²)
  ' { vec3 dl = rectAreaLight.position - geometryPosition; if ( max( rectAreaLight.color.r, max( rectAreaLight.color.g, rectAreaLight.color.b ) ) * 4.0 * length( rectAreaLight.halfWidth ) * length( rectAreaLight.halfHeight ) < 0.03 * dot( dl, dl ) ) continue; }$1');

// 12 copias por material, y cada shader tardaba 5-15 s en D3D. Las que tienen sombra siguen desenrolladas (el mapa de
// sombra necesita un índice fijo); las demás van en un bucle de verdad.
{ const RE = 'RE_Direct( directLight, geometryPosition, geometryNormal, geometryViewDir, geometryClearcoatNormal, material, reflectedLight );';
  const PL = 'pointLight = pointLights[ i ]; getPointLightInfo( pointLight, geometryPosition, directLight );';
  const SL = 'spotLight = spotLights[ i ]; getSpotLightInfo( spotLight, geometryPosition, directLight );';
  const src = THREE.ShaderChunk.lights_fragment_begin, a = src.indexOf('#if ( NUM_POINT_LIGHTS > 0 ) && defined( RE_Direct )'),

	PointLight pointLight;
	#if defined( USE_SHADOWMAP ) && NUM_POINT_LIGHT_SHADOWS > 0 && ( defined( SHADOWMAP_TYPE_PCF ) || defined( SHADOWMAP_TYPE_BASIC ) )
	PointLightShadow pointLightShadow;
	#pragma unroll_loop_start
	for ( int i = 0; i < NUM_POINT_LIGHT_SHADOWS; i ++ ) {

		pointLightShadow = pointLightShadows[ i ];
		directLight.color *= ( directLight.visible && receiveShadow ) ? getPointShadow( pointShadowMap[ i ], pointLightShadow.shadowMapSize, pointLightShadow.shadowIntensity, pointLightShadow.shadowBias, pointLightShadow.shadowRadius, vPointShadowCoord[ i ], pointLightShadow.shadowCameraNear, pointLightShadow.shadowCameraFar ) : 1.0;

	}
	#pragma unroll_loop_end
	for ( int i = NUM_POINT_LIGHT_SHADOWS; i < min( NUM_POINT_LIGHTS, RC_N ); i ++ ) { ${PL} ${RE} }

	for ( int i = 0; i < min( NUM_POINT_LIGHTS, RC_N ); i ++ ) { ${PL} ${RE} }
	#endif
#endif
#if ( NUM_SPOT_LIGHTS > 0 ) && defined( RE_Direct ) && ( NUM_SPOT_LIGHT_SHADOWS == 0 ) && ( NUM_SPOT_LIGHT_MAPS == 0 )

	for ( int i = 0; i < min( NUM_SPOT_LIGHTS, RC_N ); i ++ ) { ${SL} ${RE} }

// (siempre mayor que la cantidad de luces) los deja como bucle de verdad.

const REC = !!navigator.webdriver;   // grabación cuadro a cuadro vs. demo en vivo
// en vivo: el composer ya dibuja en sus propios buffers, así que el antialias del lienzo no se ve y solo cuesta
const renderer = new THREE.WebGLRenderer({ antialias: REC, preserveDrawingBuffer: REC, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.debug.checkShaderErrors = false;   // revisar cada shader en su primer uso frena el cuadro hasta que la placa termina todo lo pendiente
renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;   // PCFSoft está deprecado: three lo cambiaba por PCF recién al dibujar y la precompilación no servía
// la oficina no se mueve: las sombras se calculan una vez (la lámpara proyecta en 6 caras, era el gasto mayor)
renderer.shadowMap.autoUpdate = false; renderer.shadowMap.needsUpdate = true;
document.body.prepend(renderer.domElement);

scene.background = new THREE.Color(0x050507);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.1;
const camera = new THREE.PerspectiveCamera(40, W / H, 0.05, 300);
performance.mark('rc-renderer');

// ---------- el piso: planta libre de 18 × 12 m, muro cortina al fondo ----------
const X0 = -10.6, X1 = 9, Z0 = -9.0, Z1 = 8.6, CEIL = 3.4, SILL = 0.14, HEAD = 3.18;
const RXW = -4.6, XC = (X0 + X1) / 2, ZM = (Z0 + Z1) / 2;   // las salas vidriadas ocupan la franja izquierda
function oakTex() {
  const c = document.createElement('canvas'); c.width = c.height = 1024;
  const g = c.getContext('2d'); let s = 11; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let y = 0; y < 1024; y += 64) { let x = -Math.floor(r() * 400); while (x < 1024) { const len = 300 + Math.floor(r() * 260);
    const l = 17 + r() * 6; g.fillStyle = `hsl(${24 + r() * 6} ${30 + r() * 8}% ${l}%)`; g.fillRect(x, y, len, 64);
    for (let k = 0; k < 14; k++) { g.strokeStyle = `rgba(0,0,0,${0.05 + r() * 0.08})`; g.lineWidth = 1 + r() * 2; g.beginPath(); const yy = y + r() * 64; g.moveTo(x, yy); g.bezierCurveTo(x + len * .3, yy + r() * 6 - 3, x + len * .7, yy + r() * 6 - 3, x + len, yy); g.stroke(); }
    g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(x, y, 2, 64); x += len; }
    g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, y, 1024, 2); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(9.4, 6.4); t.anisotropy = 8; return t;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(X1 - X0, Z1 - Z0), new THREE.MeshStandardMaterial({ map: oakTex(), roughness: 0.32, metalness: 0, envMapIntensity: 1.2 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(XC, 0, ZM); floor.receiveShadow = true; scene.add(floor);
const plaster = new THREE.MeshStandardMaterial({ color: 0x1b1b1f, roughness: 0.92 });
const slab = new THREE.MeshStandardMaterial({ color: 0x101013, roughness: 0.85 });
const frameM = new THREE.MeshStandardMaterial({ color: 0x0d0d0f, roughness: 0.35, metalness: 0.6 });
const walnut = new THREE.MeshStandardMaterial({ color: 0x3a2416, roughness: 0.45 });
const brass = new THREE.MeshStandardMaterial({ color: 0xc89b5a, roughness: 0.28, metalness: 1, envMapIntensity: 1.6 });
const box = (w, h, d, m, x, y, z, parent = scene) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; parent.add(o); return o; };
const rbox = (w, h, d, m, x, y, z, r = 0.04) => { const o = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, r), m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; scene.add(o); return o; };
// losa con canto: el piso se lee como un corte del edificio
box(X1 - X0 + 0.3, 0.32, Z1 - Z0 + 0.3, slab, XC, -0.165, ZM);
// muros de una sola cara (hacia adentro): desde la vista de presencia el piso queda abierto
function wall(w, h, x, y, z, ry, m = plaster) { const o = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m); o.position.set(x, y, z); o.rotation.y = ry; o.receiveShadow = true; scene.add(o); return o; }
wall(Z1 - Z0, CEIL, X0, CEIL / 2, ZM, Math.PI / 2);
wall(Z1 - Z0, CEIL, X1, CEIL / 2, ZM, -Math.PI / 2);
wall(X1 - X0, CEIL, XC, CEIL / 2, Z1, Math.PI);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(X1 - X0, Z1 - Z0), new THREE.MeshStandardMaterial({ color: 0x141417, roughness: 0.9 }));
ceil.rotation.x = Math.PI / 2; ceil.position.set(XC, CEIL, ZM); scene.add(ceil);
// muro cortina: antepecho, perfiles finos cada 1,5 m, dintel
box(X1 - X0, SILL, 0.22, frameM, XC, SILL / 2, Z0);
box(X1 - X0, CEIL - HEAD, 0.22, slab, XC, (CEIL + HEAD) / 2, Z0);
for (let x = X0 + 0.03; x <= X1; x += 1.5) box(0.05, HEAD - SILL, 0.12, frameM, Math.min(x, X1 - 0.03), (HEAD + SILL) / 2, Z0);
const glassM = new THREE.MeshStandardMaterial({ color: 0x9fb4ff, roughness: 0.04, transparent: true, opacity: 0.05, depthWrite: false, envMapIntensity: 2.5 });
const g0 = new THREE.Mesh(new THREE.PlaneGeometry(X1 - X0, HEAD - SILL), glassM); g0.position.set(XC, (HEAD + SILL) / 2, Z0 + 0.02); scene.add(g0);

// ---------- la ciudad de la llegada, detrás del vidrio ----------
const tl = new THREE.TextureLoader();
const cityTex = tl.load('./tu-puesto/ciudad.jpg'); cityTex.colorSpace = THREE.SRGBColorSpace; cityTex.anisotropy = 8;
const CZ = -40, CH = 40, CW = CH * (3200 / 1400);
const cityM = new THREE.MeshBasicMaterial({ map: cityTex, toneMapped: false, color: new THREE.Color(0.9, 0.9, 0.94) });
const city = new THREE.Mesh(new THREE.PlaneGeometry(CW, CH), cityM);
city.position.set(2, 2.5, CZ); scene.add(city);

// ---------- salas vidriadas (franja izquierda) ----------
const ROOMS = [
  { name: 'REUNIONES', z0: Z0, z1: -4.4 },
  { name: 'DIRECCIÓN', z0: -4.4, z1: -1.4 },
  { name: 'RECREO', z0: -1.4, z1: 3.0, door: -0.6 },
  { name: 'GIMNASIO', z0: 3.0, z1: Z1 },

const partM = new THREE.MeshStandardMaterial({ color: 0xb8c4ff, roughness: 0.05, transparent: true, opacity: 0.07, depthWrite: false, envMapIntensity: 2.2, side: THREE.DoubleSide });
function band(text) {   // franja esmerilada con el nombre de la sala, sobre el vidrio
  const c = document.createElement('canvas'); c.width = 1024; c.height = 96; const g = c.getContext('2d');
  g.fillStyle = 'rgba(235,238,245,0.16)'; g.fillRect(0, 0, 1024, 96);
  g.font = '600 40px "Cascadia Mono",Consolas,monospace'; g.letterSpacing = '14px'; g.fillStyle = 'rgba(246,244,239,0.95)'; g.fillText(text, 54, 62);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;

const doorM = new THREE.MeshStandardMaterial({ color: 0x8f98b8, roughness: 0.08, transparent: true, opacity: 0.16, depthWrite: false, envMapIntensity: 2.4, side: THREE.DoubleSide });
const roomLights = [];
for (const r of ROOMS) {
  const d = r.z1 - r.z0, zc = (r.z0 + r.z1) / 2, dz = r.door ?? zc;
  const p = new THREE.Mesh(new THREE.PlaneGeometry(d, CEIL), partM); p.position.set(RXW, CEIL / 2, zc); p.rotation.y = Math.PI / 2; scene.add(p);
  for (const z of [r.z0 + 0.03, dz - 0.45, dz + 0.45, r.z1 - 0.03]) box(0.05, CEIL, 0.05, frameM, RXW, CEIL / 2, z);
  box(0.06, 0.05, d, frameM, RXW, 2.3, zc);
  // puerta de vidrio entre los dos parantes centrales: hoja algo más ahumada, marco fino y tirador de bronce a cada lado
  { const dw = 0.86, dh = 2.26;
    const leaf = new THREE.Mesh(new THREE.PlaneGeometry(dw, dh), doorM); leaf.position.set(RXW + 0.012, dh / 2 + 0.01, dz); leaf.rotation.y = Math.PI / 2; scene.add(leaf);
    box(0.035, 0.03, dw, frameM, RXW + 0.012, dh + 0.01, dz); box(0.035, 0.07, dw, frameM, RXW + 0.012, 0.045, dz);
    for (const e of [-1, 1]) box(0.035, dh, 0.022, frameM, RXW + 0.012, dh / 2 + 0.01, dz + e * dw / 2);
    for (const sx of [-1, 1]) { box(0.022, 0.62, 0.022, brass, RXW + 0.012 + sx * 0.075, 1.05, dz + dw / 2 - 0.1);
      for (const y of [0.8, 1.3]) box(0.06, 0.016, 0.016, brass, RXW + 0.012 + sx * 0.04, y, dz + dw / 2 - 0.1); } }
  const b = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.15), band(r.name)); b.position.set(RXW + 0.01, 1.55, dz < zc - 0.3 ? r.z1 - 0.95 : r.z0 + 0.95); b.rotation.y = Math.PI / 2; scene.add(b);
  if (r.z0 > Z0) { const s = new THREE.Mesh(new THREE.PlaneGeometry(X0 - RXW, CEIL), partM); s.position.set((X0 + RXW) / 2, CEIL / 2, r.z0); scene.add(s); box(X0 - RXW, 0.05, 0.05, frameM, (X0 + RXW) / 2, CEIL - 0.03, r.z0); }
  // luz cálida de cada sala
  // en la sala de juntas la puntual iba metida entre los anillos de bronce y los quemaba: se corre al lado de la puerta y baja
  const jr = r.name === 'REUNIONES', gy = r.name === 'GIMNASIO', l = new THREE.PointLight(gy ? 0xe6ebff : 0xffc48a, 6, 9, 2); l.userData.f = jr ? 0.45 : gy ? 0.3 : 1;
