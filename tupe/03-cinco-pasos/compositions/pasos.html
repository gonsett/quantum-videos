  </style>

  <div id="root" data-composition-id="pasos" data-width="1080" data-height="1920" data-layout-allow-overlap data-layout-allow-overflow>

    <div id="sillon">

      <div class="msk" id="s-calor"></div>

    <div class="micro m1" id="m-2" style="opacity:0">PASO 2 DE 5</div>
    <div class="micro m1" id="m-3" style="opacity:0">PASO 3 DE 5</div>
    <div class="micro m1" id="m-4" style="opacity:0">PASO 4 DE 5</div>
    <div class="micro m1" id="m-5" style="opacity:0">PASO 5 DE 5</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const R = document.querySelector('[data-composition-id="pasos"]');
    const $ = (s) => R.querySelector(s);

    // Tiempos (segundos desde el inicio de esta composición). Se ajustan a la voz.
    const T = window.__T_PASOS || { p1: .1, p2: 6.7, p2b: 9.0, p3: 10.9, p3b: 15.9, p4: 17.85, p4b: 19.6, p4c: 20.8, p5: 22.2, p5b: 23.6, fin: 24.6, logo: 27.1, DUR: 30.6 };
    const DUR = T.DUR;

    // ---------- títulos ----------
    const TIT = [
      { id: "a", top: 318, size: 136, l: ["Antes de abrir", "reservas,", "hacé esto."], ac: 2 },
      { id: "p1", top: 300, size: 112, l: ["Cada servicio,", "con lo que dura."], ac: 1 },
      { id: "p2", top: 300, size: 112, l: ["Tus horarios,", "y tu descanso."], ac: 1 },
      { id: "p3", top: 300, size: 112, l: ["El que llega", "sin turno, a la agenda."], ac: 1, size2: 92 },
      { id: "p4", top: 300, size: 112, l: ["Reservá vos", "primero."], ac: 1 },
      { id: "p5", top: 300, size: 112, l: ["Compartí", "tu link."], ac: 1 },
      { id: "f", top: 300, size: 112, l: ["Tu sillón,", "listo para que reserven."], ac: 1, size2: 88 },
    ];
    const tit = $("#titulos");
    for (const g of TIT) g.l.forEach((txt, i) => {
      const s = i > 0 && g.size2 ? g.size2 : g.size, alto = s * 1.25, paso = g.id === "a" ? 140 : g.size * 1.16;
      const d = document.createElement("div"); d.className = "linea"; d.style.top = (g.top + i * paso) + "px"; d.style.height = alto + "px";
      d.innerHTML = `<div class="t${i === g.ac ? " ac" : ""}" id="t-${g.id}-${i}" style="left:0;top:${s * .1}px;font-size:${s}px">${txt}</div>`;
      tit.appendChild(d);
    });
    const lineas = (id) => TIT.find((g) => g.id === id).l.map((_, i) => "#t-" + id + "-" + i);

    // ---------- tarjetas (pantallas reales) ----------
    // recorte: [arriba, abajo] en px de la captura; anillos y toques en px de la captura
    const P = "assets/pantallas/";
    const CARDS = [
      { id: "c1", src: "servicios.png", w: 1110, rec: [0, 1270], top: 660, anillos: [[48, 570, 317, 706], [48, 1100, 317, 1237]] },
      { id: "c2", src: "horarios.png", w: 1110, rec: [0, 1040], top: 700, anillos: [[30, 270, 1075, 418]] },
      { id: "c2b", src: "bloqueado.png", w: 1110, rec: [0, 1035], top: 700, anillos: [[161, 573, 1091, 702]] },
      { id: "c3", src: "turno.png", w: 1170, rec: [0, 1640], top: 620, anillos: [[53, 1275, 1111, 1410]], toque: [582, 1518], boton: [53, 1448, 1111, 1588] },
      { id: "c4", src: "res-servicio.png", w: 925, rec: [0, 1180], top: 660, anillos: [[40, 160, 885, 570]] },
      { id: "c4b", src: "res-cuando.png", w: 925, rec: [0, 1061], top: 700, anillos: [[472, 702, 668, 814]] },
      { id: "c4c", src: "res-ticket.png", w: 925, rec: [0, 1137], top: 680, toque: [462, 949], boton: [54, 880, 870, 1018] },
      { id: "c5", src: "barberia-full.png", w: 1170, rec: [400, 1600], top: 720, anillos: [[60, 1400, 1110, 1548]], toque: [968, 1473], boton: [854, 1407, 1085, 1539] },
    ];
    const tar = $("#tarjetas");
    for (const c of CARDS) {
      const k = 820 / c.w, h = (c.rec[1] - c.rec[0]) * k;
      c.k = k; c.h = h;
      const d = document.createElement("div"); d.className = "card"; d.id = c.id; d.style.top = c.top + "px"; d.style.height = h + "px";
      let html = `<div class="lienzo" style="width:820px;height:${h}px"><img src="${P + c.src}" style="width:820px;top:${-c.rec[0] * k}px" />`;
      (c.anillos || []).forEach((a, i) => {
        html += `<div class="anillo" id="${c.id}-a${i}" style="left:${a[0] * k - 8}px;top:${(a[1] - c.rec[0]) * k - 8}px;width:${(a[2] - a[0]) * k + 16}px;height:${(a[3] - a[1]) * k + 16}px"></div>`;
      });
      if (c.toque) html += `<div class="toque" id="${c.id}-t" style="left:${c.toque[0] * k}px;top:${(c.toque[1] - c.rec[0]) * k}px"></div>`;
      html += `</div><div class="tibio"></div><div class="reflejo" id="${c.id}-r"></div>`;
      d.innerHTML = html; tar.appendChild(d);
    }

    // ---------- sillón, luz y polvo ----------
    const C = { s: 1.035, y: -8, luz: 1, haz: 1, osc: 0 };
    const reloj = { t: 0 };
    let semilla = 20261110;
    const az = () => { semilla = (semilla + 0x6D2B79F5) | 0; let z = Math.imul(semilla ^ (semilla >>> 15), 1 | semilla); z = (z + Math.imul(z ^ (z >>> 7), 61 | z)) ^ z; return ((z ^ (z >>> 14)) >>> 0) / 4294967296; };
    const polvo = Array.from({ length: 90 }, () => ({ x: 300 + az() * 480, y: az() * 1920, v: 10 + az() * 30, r: az() < .14 ? 8 + az() * 18 : .7 + az() * 1.7, a: az(), f: az() * 6.28 }));
    const ctx = $("#polvo").getContext("2d");
    const luzBlanda = document.createElement("canvas"); luzBlanda.width = luzBlanda.height = 128;
    { const g = luzBlanda.getContext("2d"), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      r.addColorStop(0, "rgba(255,207,166,1)"); r.addColorStop(.35, "rgba(255,207,166,.45)"); r.addColorStop(1, "rgba(255,207,166,0)");
      g.fillStyle = r; g.fillRect(0, 0, 128, 128); }
    const enHaz = (x, y) => { const ancho = 80 + y * .22; return Math.max(0, 1 - Math.abs(x - 540) / ancho) * C.haz; };
    const grano = $("#grano"), sillon = $("#sillon");
    const FL = { o: 0, sx: .4, y: 930 };
    function dibujar() {
      const t = reloj.t + 3, cu = Math.floor(t * 24);
      grano.style.backgroundPosition = ((cu * 197) % 512) + "px " + ((cu * 311) % 512) + "px";
      sillon.style.transform = `translate(0px, ${C.y}px) scale(${C.s})`;
      const l = Math.max(0, Math.min(1, C.luz));
      $("#s-osc").style.opacity = Math.min(.93, (1 - l) * .93 + C.osc);
      $("#s-luz").style.opacity = l * .9;
      $("#s-calor").style.opacity = l;
      $("#haz").style.opacity = C.haz;
      $("#charco").style.opacity = l;
      $("#sombra").style.opacity = l * Math.max(0, Math.min(1, (1.9 - C.s) / .8));
      $("#sala").style.opacity = .35 + l * .65;
      const fl = $("#fl"); fl.style.top = FL.y + "px"; fl.style.opacity = FL.o; fl.style.transform = `scaleX(${FL.sx})`;
      ctx.clearRect(0, 0, 1080, 1920); ctx.fillStyle = "#ffcfa6";
      for (const q of polvo) {
        const y = ((q.y - q.v * t) % 1920 + 1920) % 1920, x = q.x + Math.sin(q.f + t * .7) * 14;
        const i = enHaz(x, y); if (i < .03) continue;
        if (q.r > 5) { ctx.globalAlpha = i * (.06 + q.a * .08); const d = q.r * 3.4; ctx.drawImage(luzBlanda, x - d / 2, y - d / 2, d, d); continue; }
        ctx.globalAlpha = i * (.3 + q.a * .55); ctx.beginPath(); ctx.arc(x, y, q.r, 0, 6.2832); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    const tl = gsap.timeline({ paused: true, onUpdate: dibujar });
    tl.to(reloj, { t: DUR, duration: DUR, ease: "none" }, 0);

    const fuera = (sel, at) => tl.to(sel, { yPercent: -118, duration: .42, ease: "power3.in", stagger: .05 }, at);
    const dentro = (sel, at) => tl.fromTo(sel, { yPercent: 118 }, { yPercent: 0, duration: .55, ease: "expo.out", stagger: .09 }, at);
    const micro = (de, a, at) => { tl.to(de, { opacity: 0, duration: .2 }, at); tl.fromTo(a, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .35, ease: "power2.out" }, at + .15); };
    const destello = (y, at) => { tl.set(FL, { y }, at); tl.fromTo(FL, { o: 0, sx: .3 }, { o: 1, sx: 1, duration: .14, ease: "power2.out" }, at); tl.to(FL, { o: 0, sx: 1.4, duration: .4, ease: "power2.in" }, at + .14); };
    const cardY = (id) => CARDS.find((c) => c.id === id);

    // la pantalla llega desde la luz: sube, se enfoca y la cruza un reflejo
    function entra(id, at) {
      tl.fromTo("#" + id, { opacity: 0, y: 110, scale: 1.06, filter: "blur(16px) brightness(1.6)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px) brightness(1)", duration: .7, ease: "expo.out" }, at);
      tl.fromTo("#" + id + "-r", { backgroundPosition: "140% 0" }, { backgroundPosition: "-40% 0", duration: 1.1, ease: "power1.inOut" }, at + .15);
      tl.fromTo("#" + id + " .lienzo", { scale: 1 }, { scale: 1.035, duration: 4, ease: "none" }, at);
    }
    function sale(id, at) {
      tl.to("#" + id, { opacity: 0, y: -70, scale: .965, filter: "blur(12px) brightness(.6)", duration: .38, ease: "power2.in" }, at);
    }
    // cambio de pantalla dentro del mismo paso: como navegar en la app
    function pasa(de, a, at) {
      tl.to("#" + de, { opacity: 0, x: -140, filter: "blur(8px)", duration: .36, ease: "power2.in" }, at);
      tl.fromTo("#" + a, { opacity: 0, x: 160, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: .6, ease: "expo.out" }, at + .2);
      tl.fromTo("#" + a + "-r", { backgroundPosition: "140% 0" }, { backgroundPosition: "-40% 0", duration: 1, ease: "power1.inOut" }, at + .3);
      tl.fromTo("#" + a + " .lienzo", { scale: 1 }, { scale: 1.03, duration: 3, ease: "none" }, at + .2);
    }
    const marca = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: .45, ease: "back.out(2)" }, at);
    function toca(id, at) {
      const c = cardY(id), b = c.boton, k = c.k;
      tl.fromTo("#" + id + "-t", { opacity: .95, scale: .2 }, { opacity: 0, scale: 2.4, duration: .6, ease: "power2.out" }, at);
    }

    // ---------- 0. salida del arranque: el sillón baja a la penumbra ----------
    tl.set(lineas("p1").concat(lineas("p2"), lineas("p3"), lineas("p4"), lineas("p5"), lineas("f")), { yPercent: 118 }, 0);
    fuera(lineas("a"), 0);
    tl.to(C, { s: .72, y: 560, osc: .55, luz: .7, haz: .45, duration: .9, ease: "expo.inOut" }, 0);
    destello(640, .12);

    // ---------- 1. servicios ----------
    micro("#m0", "#m-1", T.p1);
    tl.to("#avance", { scaleX: .2, duration: .7, ease: "expo.out" }, T.p1);
    dentro(lineas("p1"), T.p1 + .1);
    entra("c1", T.p1 + .2);
    marca("#c1-a0", T.p1 + 4.0); marca("#c1-a1", T.p1 + 5.2);

    // ---------- 2. horarios y descanso ----------
    fuera(lineas("p1"), T.p2 - .3); sale("c1", T.p2 - .3); destello(640, T.p2 - .05);
    micro("#m-1", "#m-2", T.p2);
    tl.to("#avance", { scaleX: .4, duration: .7, ease: "expo.out" }, T.p2);
    dentro(lineas("p2"), T.p2 + .1);
    entra("c2", T.p2 + .15);
    marca("#c2-a0", T.p2 + 1.6);
    pasa("c2", "c2b", T.p2b);
    marca("#c2b-a0", T.p2b + .6);

    // ---------- 3. el que llega sin turno ----------
    fuera(lineas("p2"), T.p3 - .3); sale("c2b", T.p3 - .3); destello(640, T.p3 - .05);
    micro("#m-2", "#m-3", T.p3);
    tl.to("#avance", { scaleX: .6, duration: .7, ease: "expo.out" }, T.p3);
    dentro(lineas("p3"), T.p3 + .1);
    entra("c3", T.p3 + .15);
    marca("#c3-a0", T.p3 + 3.0);
    tl.to("#c3-a0", { opacity: 0, duration: .3 }, T.p3b - .4);
    toca("c3", T.p3b);

    // ---------- 4. reservá vos primero ----------
    fuera(lineas("p3"), T.p4 - .3); sale("c3", T.p4 - .3); destello(640, T.p4 - .05);
    micro("#m-3", "#m-4", T.p4);
    tl.to("#avance", { scaleX: .8, duration: .7, ease: "expo.out" }, T.p4);
    dentro(lineas("p4"), T.p4 + .1);
    entra("c4", T.p4 + .15);
    marca("#c4-a0", T.p4 + .6);
    pasa("c4", "c4b", T.p4b);
    marca("#c4b-a0", T.p4b + .55);
    pasa("c4b", "c4c", T.p4c);
    toca("c4c", T.p4c + .75);

    // ---------- 5. compartí tu link ----------
    fuera(lineas("p4"), T.p5 - .3); sale("c4c", T.p5 - .3); destello(640, T.p5 - .05);
    micro("#m-4", "#m-5", T.p5);
    tl.to("#avance", { scaleX: 1, duration: .7, ease: "expo.out" }, T.p5);
    dentro(lineas("p5"), T.p5 + .1);
    entra("c5", T.p5 + .15);
    marca("#c5-a0", T.p5 + .7);
    toca("c5", T.p5b);

    // ---------- cierre: el sillón vuelve a su luz ----------
    fuera(lineas("p5"), T.fin - .3); sale("c5", T.fin - .3);
    micro("#m-5", "#m-6", T.fin);
    tl.to(C, { s: 1, y: 0, osc: 0, luz: 1, haz: 1, duration: 1.2, ease: "expo.inOut" }, T.fin - .2);
    tl.set(C, { luz: .6, haz: .5 }, T.fin + .9).to(C, { luz: 1, haz: 1, duration: .1 }, T.fin + .98);
