      -webkit-mask: url(assets/logo.png) 0 0 / 100% 100%; mask: url(assets/logo.png) 0 0 / 100% 100%; }

  <div id="root" data-composition-id="reel" data-width="1080" data-height="1920" data-layout-allow-overlap data-layout-allow-overflow>

    <p class="pie" id="pB">POR MES · <i>EL MISMO CAFÉ</i></p>

      <img src="assets/objetos/taza.png" alt="" />
      <div id="tazaSomb" class="mT"></div>

        <div class="mov"><div class="que"><b>Kiosco</b><span>13:15 · Efectivo</span></div><em class="etq">hormiga</em><span class="imp">$&nbsp;140</span></div>
        <div class="mov"><div class="que"><b>Merienda</b><span>17:30 · Débito</span></div><em class="etq">hormiga</em><span class="imp">$&nbsp;210</span></div>

    <p class="tit l2" id="t2">Todos los días.</p>

    <p class="tit l2" id="t4">sin darte cuenta.</p>

    <p class="tit l2" id="t6">gastos hormiga.</p>

    <p class="tit l2" id="t8">gastar por día.</p>

  <script>
    const DUR = 23;
    const root = document.querySelector('[data-composition-id="reel"]');
    const $ = s => root.querySelector(s);
    const TITS = ['#t1', '#t2', '#t3', '#t4', '#t5', '#t6', '#t7', '#t8', '#t9', '#t10'];

    for (const id of TITS) {
      const el = $(id); const txt = el.textContent; el.textContent = '';
      for (const ch of txt) { const s = document.createElement('span'); s.textContent = ch === ' ' ? ' ' : ch; el.appendChild(s); }
    }

    const st = { t: 0, vapor: 0, pct: 0 };
    const pctEl = $('#pct');

    // Cifra: 90 → 2.700 (por mes) y después 2.700 → 32.850 (por año), con desenfoque proporcional a la velocidad.
    const T = 1.75, DC = 1.0, numEl = $('#num');
    const T2 = 8.15, DC2 = 2.3;
    const eC = gsap.parseEase('expo.inOut');
    const pC = t => eC(Math.min(1, Math.max(0, (t - T) / DC)));
    const pC2 = t => eC(Math.min(1, Math.max(0, (t - T2) / DC2)));
    const fmt = v => Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    function cuenta(t) {
      const p = pC(t), p2 = pC2(t);
      let txt;
      // redondeo mientras corre, para que no tiemble el último dígito
      if (p2 > 0) txt = fmt(p2 >= 1 ? 32850 : Math.round((2700 + (32850 - 2700) * p2) / 50) * 50);
      else txt = fmt(p >= 1 ? 2700 : Math.round((90 + (2700 - 90) * p) / 10) * 10);
      if (numEl.textContent !== txt) numEl.textContent = txt;
      const vel = Math.abs(pC(t) - pC(t - 1 / 60)) * 60 + Math.abs(pC2(t) - pC2(t - 1 / 60)) * 60 * 1.6;
      numEl.style.filter = `blur(${Math.min(7, vel * 3.2).toFixed(2)}px)`;
      pctEl.textContent = Math.round(st.pct) + ' %';
    }

    // Vapor: filamentos finos de humo que suben de la crema y se abren; deterministas.
    let seed = 23; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const hilos = Array.from({ length: 11 }, () => ({
      x: 541 + (rnd() - .5) * 250, vida: 3.2 + rnd() * 1.6, off: rnd() * 6, sube: 330 + rnd() * 200,
      k1: 3 + rnd() * 3, k2: 7 + rnd() * 5, w1: .8 + rnd() * .8, w2: 1.2 + rnd() * 1.2, amp: 18 + rnd() * 26, amp2: 6 + rnd() * 10,
      f: rnd() * 6.28, a: .55 + rnd() * .45, lw: 2.2 + rnd() * 2.6,
    }));
    const cV = $('#vapor').getContext('2d');
    function trazo(h, t, y0, pase) {
      const e = ((t + h.off) % h.vida) / h.vida;
      const vive = Math.pow(Math.sin(Math.PI * e), 1.3) * st.vapor * h.a;
      if (vive < .01) return;
      const largo = h.sube * (.45 + .55 * e);
      const N = 26; let px = null, py = null;
      for (let i = 0; i <= N; i++) {
        const s = i / N, yy = y0 - s * largo - e * 40;
        const xx = h.x + Math.sin(s * h.k1 + t * h.w1 + h.f) * h.amp * s + Math.sin(s * h.k2 - t * h.w2 + h.f * 2) * h.amp2 * s * s + s * e * 30;
        if (px !== null) {
          const al = vive * Math.pow(Math.sin(Math.PI * Math.min(1, s * 1.15)), 1.2) * (1 - s * .55);
          cV.strokeStyle = pase ? `rgba(255,238,210,${al * .1})` : `rgba(255,232,196,${al * .045})`;
          cV.lineWidth = pase ? h.lw * (1 + s * 2.2) : h.lw * (5 + s * 9);
          cV.beginPath(); cV.moveTo(px, py); cV.lineTo(xx, yy); cV.stroke();
        }
        px = xx; py = yy;
      }
    }
    function pintar() {
      const t = st.t;
      cV.clearRect(0, 0, 1080, 1920);
      const y0 = 1190 + (gsap.getProperty('#tazaPos', 'y') || 0);
      cV.lineCap = 'round';
      cV.filter = 'blur(14px)'; for (const h of hilos) trazo(h, t, y0, 0);
      cV.filter = 'blur(3.5px)'; for (const h of hilos) trazo(h, t, y0, 1);
      cV.filter = 'none';
      cuenta(t);
      const fr = Math.floor(t * 60);
      $('#grano').style.backgroundPosition = `${(fr * 137) % 512}px ${(fr * 251) % 512}px`;
    }

    const tl = gsap.timeline({ paused: true, onUpdate: pintar });
    const entra = (id, t) => tl.fromTo(id + ' span', { opacity: 0, y: 46, filter: 'blur(14px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.0, ease: 'expo.out', stagger: .026 }, t);
    const sale = (ids, t) => tl.to(ids.map(i => i + ' span').join(','), { opacity: 0, y: -34, filter: 'blur(12px)', duration: .5, ease: 'power2.in', stagger: .01 }, t);
    const barre = (id, t, d) => tl.fromTo(id, { backgroundPosition: '130% 0%' }, { backgroundPosition: '-30% 100%', duration: d, ease: 'power2.inOut', immediateRender: false }, t);

    gsap.set(['#pB', '#pC', '#tarjeta', '#logo'], { opacity: 0 });
    gsap.set(TITS.slice(2).map(i => i + ' span').join(','), { opacity: 0 });
    gsap.set('#marca', { y: 180 });
    gsap.set('#subra', { scaleX: 0 });
    tl.to(st, { t: DUR, duration: DUR, ease: 'none' }, 0);
    tl.fromTo('#negro', { opacity: 1 }, { opacity: 0, duration: .45, ease: 'power2.out' }, 0);
    tl.fromTo('#pozo', { opacity: 0 }, { opacity: 1, duration: 1.2, ease: 'power2.out' }, .35);

    // ===== 1. (prueba aprobada) La taza sube desde la sombra y se asienta; la cámara nunca se detiene.
    tl.fromTo('#tazaPos', { y: 210, scale: 1.08, opacity: 0, filter: 'blur(16px)' }, { y: 0, scale: 1, opacity: 1, filter: 'blur(0px)', duration: 1.45, ease: 'expo.out' }, .1);
    tl.to('#tazaPos', { y: -14, scale: 1.022, duration: 1.45, ease: 'sine.inOut' }, 1.55);
    tl.fromTo('#sombra', { opacity: 0, scaleX: .55 }, { opacity: 1, scaleX: 1, duration: 1.3, ease: 'expo.out' }, .25);
    tl.to('#sombra', { scaleX: .98, opacity: .9, duration: 1.45, ease: 'sine.inOut' }, 1.55);
    tl.fromTo(st, { vapor: 0 }, { vapor: 1, duration: 1.4, ease: 'power2.out' }, .8);
    barre('#porc', .75, 1.6);
    barre('#cremaLuz', .9, 1.6);
    barre('#oroLuz, #oroBloom', 1.0, 1.35);

    tl.fromTo('#regla', { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: 'expo.out' }, .3);
    tl.fromTo('#m1, #m2', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .8, ease: 'expo.out', stagger: .08 }, .42);
    entra('#t1', .35);
    entra('#t2', .85);

    tl.fromTo('#cifra', { opacity: 0, y: 30, scale: 1.04, filter: 'blur(16px)' }, { opacity: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: 1.0, ease: 'expo.out' }, .55);
    tl.fromTo('#pA', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .8, ease: 'expo.out' }, .9);
    tl.to('#cifra', { keyframes: [{ scale: .97, duration: .45, ease: 'power2.inOut' }, { scale: 1, duration: .7, ease: 'expo.out' }] }, T);
    tl.to('#pA', { opacity: 0, y: -8, duration: .35, ease: 'power2.in' }, T);
    tl.fromTo('#pB', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .6, ease: 'expo.out' }, T + .55);

    // ===== 2. «Son dos mil setecientos pesos al mes.» La taza respira; otro filo de luz recorre el oro.
    tl.to('#tazaPos', { y: -40, scale: 1.05, duration: 5.2, ease: 'sine.inOut' }, 3.0);
    tl.to('#sombra', { scaleX: .95, opacity: .82, duration: 5.2, ease: 'sine.inOut' }, 3.0);
    barre('#oroLuz, #oroBloom', 3.4, 1.5);
    barre('#porc', 3.6, 2.0);

    // ===== 3. «Y en un año… treinta y dos mil ochocientos cincuenta.»
    sale(['#t1', '#t2'], 6.0);
    entra('#t3', 6.75);
    entra('#t4', 7.45);
    tl.to('#cifra', { keyframes: [{ scale: .82, duration: .55, ease: 'power2.inOut' }, { scale: .86, duration: 1.4, ease: 'expo.out' }] }, T2 - .1);
    tl.to('#pB', { opacity: 0, y: -8, duration: .35, ease: 'power2.in' }, T2);
    tl.fromTo('#pC', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .7, ease: 'expo.out', immediateRender: false }, T2 + DC2 - .2);
    barre('#oroLuz, #oroBloom', T2 + DC2 - .25, 1.1);
    barre('#cremaLuz', T2 + DC2 - .2, 1.3);

    // ===== 4. Silencio. La taza se disuelve en luz miel; el vapor se apaga.
    const TX = 11.25;
    tl.to(st, { vapor: 0, duration: .8, ease: 'power2.in' }, TX - .2);
    tl.fromTo('#halo', { opacity: 0, scale: .15 }, { opacity: 1, scale: .8, duration: .9, ease: 'power2.in', immediateRender: false }, TX);
    tl.to('#halo', { opacity: 0, scale: 1.5, duration: 1.1, ease: 'power2.out' }, TX + .9);
    tl.fromTo('#tazaPos', { filter: 'brightness(1) blur(0px)' }, { filter: 'brightness(2.6) blur(26px)', opacity: 0, scale: .9, y: 60, duration: 1.0, ease: 'power2.in', immediateRender: false }, TX + .15);
    tl.to('#sombra, #pozo', { opacity: 0, duration: .8, ease: 'power2.in' }, TX + .2);
    sale(['#t3', '#t4'], TX + .1);
    tl.to('#cifra', { opacity: 0, y: -40, filter: 'blur(16px)', duration: .7, ease: 'power2.in' }, TX + .25);
    tl.to('#pC', { opacity: 0, y: -8, duration: .45, ease: 'power2.in' }, TX + .25);

    // ===== 5. De esa luz sale la tarjeta real. «Caudal junta tus gastos hormiga…»
    const TT = 12.1;
    tl.fromTo('#aura', { opacity: 0 }, { opacity: .55, duration: 1.4, ease: 'power2.out', immediateRender: false }, TT - .1);
    tl.fromTo('#tarjeta', { opacity: 0, y: 240, scale: .9, filter: 'blur(22px) brightness(1.6)' }, { opacity: 1, y: 0, scale: 1, filter: 'blur(0px) brightness(1)', duration: 1.4, ease: 'expo.out', immediateRender: false }, TT);
