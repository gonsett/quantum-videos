# Render del reel 10 de Tupé (Cycles CPU) repartido en tramos.
name: Render Blender
on:
  workflow_dispatch:
    inputs:
      carpeta: { description: "carpeta", default: "tupe10" }
      total: { description: "cuadros (30 fps)", default: "366" }
      partes: { description: "tramos", default: "19" }
      muestras: { description: "muestras", default: "32" }
      pct: { description: "resolución %", default: "100" }
      solo: { description: "lista de prueba", default: "" }
      salida: { description: "mp4", default: "corte3d.mp4" }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { tramos: "${{ steps.p.outputs.tramos }}" }
    steps:
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          solo = "${{ inputs.solo }}".strip()
          if solo: print("tramos=" + json.dumps([{"i": "00", "c": solo}]))
          else:
              c = list(range(int("${{ inputs.total }}"))); n = int("${{ inputs.partes }}")
              print("tramos=" + json.dumps([{"i": "%02d" % i, "c": ",".join(map(str, c[len(c)*i//n:len(c)*(i+1)//n]))} for i in range(n)]))
          PY
  tramo:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy: { fail-fast: false, matrix: { tramo: "${{ fromJson(needs.plan.outputs.tramos) }}" } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        id: cb
        with: { path: blender, key: blender-4.5.3-linux }
      - name: Blender
        if: steps.cb.outputs.cache-hit != 'true'
        run: |
          curl -sL https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz | tar xJ
          mv blender-4.5.3-linux-x64 blender
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libice6 libegl1 > /dev/null
      - name: Render ${{ matrix.tramo.i }}
        run: |
          cd "${{ inputs.carpeta }}"; inicio=$(date +%s)
          CUADROS="${{ matrix.tramo.c }}" SALIDA="$GITHUB_WORKSPACE/render/" SPP="${{ inputs.muestras }}" PCT="${{ inputs.pct }}" \
            "$GITHUB_WORKSPACE/blender/blender" -b --python anim.py 2>&1 | grep -E "CUADRO|Error|rror:" | tail -40
          n=$(ls "$GITHUB_WORKSPACE/render" | wc -l); echo "cuadros: $n, s/cuadro: $(( ($(date +%s) - inicio) / (n > 0 ? n : 1) ))"
          test "$n" -eq "$(echo '${{ matrix.tramo.c }}' | tr ',' '\n' | wc -l)"
      - name: Codificar
        if: inputs.solo == ''
        run: |
          p=$(ls render | head -1 | sed 's/^0*\([0-9]\)/\1/; s/\.png//')
          ffmpeg -hide_banner -loglevel error -framerate 30 -start_number "$p" -i render/%04d.png -c:v libx264 -preset slow -crf 12 -pix_fmt yuv420p "tramo-${{ matrix.tramo.i }}.mp4"
      - uses: actions/upload-artifact@v5
        if: inputs.solo == ''
        with: { name: "tramo-${{ matrix.tramo.i }}", path: "tramo-${{ matrix.tramo.i }}.mp4", retention-days: 2, compression-level: 0 }
      - uses: actions/upload-artifact@v5
        if: inputs.solo != ''
        with: { name: prueba, path: render/*.png, retention-days: 3, compression-level: 0 }
  unir:
    needs: tramo
    if: inputs.solo == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with: { path: piezas, pattern: "tramo-*", merge-multiple: true }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: |
          cd piezas; ls tramo-*.mp4 | sort | sed "s/.*/file '&'/" > lista.txt
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i lista.txt -c copy "../${{ inputs.salida }}"
          ffprobe -v error -show_entries format=duration:stream=nb_frames -of compact "../${{ inputs.salida }}"
      - uses: actions/upload-artifact@v5
        with: { name: final, path: "${{ inputs.salida }}", retention-days: 7, compression-level: 0 }
