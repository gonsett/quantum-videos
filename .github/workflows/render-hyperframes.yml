# Render de una composición HyperFrames (HTML → MP4) en la nube.
# Se lanza con: gh workflow run render-hyperframes.yml -f carpeta=katana/ep1-muestra -f salida=muestra.mp4
name: Render HyperFrames
on:
  workflow_dispatch:
    inputs:
      carpeta: { description: "carpeta del proyecto HyperFrames (con index.html)", required: true }
      salida: { description: "nombre del mp4", default: "video.mp4" }
      fps: { description: "cuadros por segundo", default: "30" }

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      # ffmpeg estático desde GitHub (apt-get se trababa): rápido y sin depender de los espejos de Ubuntu
      - name: ffmpeg
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          echo "/tmp/ff/bin" >> "$GITHUB_PATH"
          /tmp/ff/bin/ffmpeg -version | head -1
      - name: Render
        working-directory: ${{ inputs.carpeta }}
        run: npx --yes hyperframes@0.8.17 render --output "$GITHUB_WORKSPACE/${{ inputs.salida }}" --quality high --fps ${{ inputs.fps }} 2>&1 | tail -40
      - run: test -s "${{ inputs.salida }}" && ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate -of compact "${{ inputs.salida }}"
      - uses: actions/upload-artifact@v5
        with: { name: video, path: "${{ inputs.salida }}", retention-days: 7, compression-level: 0 }
