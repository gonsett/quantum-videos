# Revisión de voz con Whisper en la nube (no usa la RAM de la PC). Se dispara con cada push a revision-gm-mundial.
name: Revision voz
on:
  push:
    branches: [revision-gm-mundial]
jobs:
  whisper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q faster-whisper soundfile
      - run: python revision/revisar.py
      - uses: actions/upload-artifact@v5
        with: { name: revision, path: revision/revision.json, retention-days: 3 }
