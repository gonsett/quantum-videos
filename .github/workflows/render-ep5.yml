# Ep. 5 «Ya pagó» (oficina-piso.html?ep5, three.js) en máquinas sin placa (WebGL por SwiftShader).
#
# push a render-ep5  → solo «verificar»: cajas.mjs (textos que se pisan, 4 máquinas) + stills a 1080×1920 (3 máquinas).
# render completo    → a mano: gh workflow run render-ep5.yml --ref render-ep5 -f completo=true
#                      (prueba de un tramo: -f completo=true -f prueba=1080-1109)
name: Render ep5
on:
  push:
    branches: [render-ep5]
  workflow_dispatch:
    inputs:
      completo: { description: "true = render repartido en 19 tramos", type: boolean, default: false }
      prueba: { description: "a-b = solo esos cuadros en una máquina (con completo=true)", default: "" }

env:
  CUADROS: "3030"     # round(50.48 * 60): cuadros 0..3029
  PARTES: "19"
  FPS: "60"
  SUB: "1"
  W: "1080"
  H: "1920"
  SALIDA: Ep5-YaPago.mp4

jobs:
  # ---------------- control previo (cada push) ----------------
  verificar:
    if: ${{ github.event_name == 'push' || !inputs.completo }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tipo: cajas, n: "1", desde: "0", hasta: "12.7" }
          - { tipo: cajas, n: "2", desde: "12.7", hasta: "25.3" }
          - { tipo: cajas, n: "3", desde: "25.3", hasta: "37.9" }
          - { tipo: cajas, n: "4", desde: "37.9", hasta: "51" }
          - { tipo: stills, n: "1", times: "1.75,4.5,7.2,9.3,10.6,12.7,16.5" }
          - { tipo: stills, n: "2", times: "18.5,21.5,23.4,25.3,28.3,30.6" }
          - { tipo: stills, n: "3", times: "31.9,35,38.5,40.8,43,48" }
    name: verificar (${{ matrix.tipo }} ${{ matrix.n }})
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: "escena\ncap", sparse-checkout-cone-mode: false }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Playwright + Chromium + fuentes (emoji)
        working-directory: cap
        run: |
          npm install --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-color-emoji fonts-noto-core > /dev/null
          fc-cache -f > /dev/null
      - name: Cajas ${{ matrix.desde }}-${{ matrix.hasta }} s
        if: matrix.tipo == 'cajas'
        working-directory: cap
        env: { DESDE: "${{ matrix.desde }}", HASTA: "${{ matrix.hasta }}" }
        run: |
          mkdir -p ../salida
          node cajas.mjs 2>&1 | tee "../salida/cajas-${{ matrix.n }}.txt"
          grep -q '^fin ' "../salida/cajas-${{ matrix.n }}.txt"
      - name: Stills ${{ matrix.times }}
        if: matrix.tipo == 'stills'
        working-directory: cap
        env: { TIMES: "${{ matrix.times }}" }
        run: |
          node rec-ep5.mjs stills "$W" "$H" ../salida 2>&1 | tee "../log-stills-${{ matrix.n }}.txt"
          cp "../log-stills-${{ matrix.n }}.txt" ../salida/
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: "${{ matrix.tipo }}-${{ matrix.n }}", path: salida, retention-days: 7 }

  juntar-control:
    needs: verificar
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with: { path: cajas, pattern: "cajas-*", merge-multiple: true }
      - uses: actions/download-artifact@v5
        with: { path: stills, pattern: "stills-*", merge-multiple: true }
      - run: ls -la cajas stills; for f in cajas/cajas-*.txt; do echo "== $f"; grep -v -E '^(cargando|· t =)' "$f"; done
      - uses: actions/upload-artifact@v5
        with: { name: cajas, path: cajas, retention-days: 7 }
      - uses: actions/upload-artifact@v5
        with: { name: stills, path: stills, retention-days: 7 }

  # ---------------- render completo (solo a mano, completo=true) ----------------
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.completo }}
    runs-on: ubuntu-latest
    outputs:
      tramos: ${{ steps.p.outputs.tramos }}
    steps:
      - id: p
        run: |
          node -e '
            const [total, partes, prueba] = [+process.argv[1], +process.argv[2], process.argv[3] || ""];
            const t = [];
            if (prueba) { const [a, b] = prueba.split("-").map(Number); t.push({ i: "00", a, b }); }
            else { const n = Math.max(1, Math.min(partes, total));
              for (let i = 0; i < n; i++) { const a = Math.floor(total * i / n), b = Math.floor(total * (i + 1) / n) - 1;
                if (b >= a) t.push({ i: String(i).padStart(2, "0"), a, b }); } }
            console.log("tramos=" + JSON.stringify(t));
          ' "$CUADROS" "$PARTES" "${{ inputs.prueba }}" | tee -a "$GITHUB_OUTPUT"

  video:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        tramo: ${{ fromJson(needs.plan.outputs.tramos) }}
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: "escena\ncap", sparse-checkout-cone-mode: false }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Playwright + Chromium + fuentes (emoji)
        working-directory: cap
        run: |
          npm install --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji fonts-noto-core > /dev/null
          fc-cache -f > /dev/null
      - name: Grabar tramo ${{ matrix.tramo.i }} (${{ matrix.tramo.a }}-${{ matrix.tramo.b }})
        working-directory: cap
        env: { DESDE: "${{ matrix.tramo.a }}", HASTA: "${{ matrix.tramo.b }}" }
        run: node rec-ep5.mjs video "$W" "$H" ../frames
      - name: Codificar tramo
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate "$FPS" -start_number ${{ matrix.tramo.a }} -i frames/f%04d.jpg \
            -frames:v $(( ${{ matrix.tramo.b }} - ${{ matrix.tramo.a }} + 1 )) \
            -c:v libx264 -crf 17 -preset slow -pix_fmt yuv420p -r "$FPS" "tramo-${{ matrix.tramo.i }}.mp4"
          ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames,width,height -of csv=p=0 "tramo-${{ matrix.tramo.i }}.mp4"
      - uses: actions/upload-artifact@v5
        with: { name: "tramo-${{ matrix.tramo.i }}", path: "tramo-${{ matrix.tramo.i }}.mp4", retention-days: 2, compression-level: 0 }

  unir:
    needs: video
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: ep5-redes.wav, sparse-checkout-cone-mode: false }
      - uses: actions/download-artifact@v5
        with: { path: piezas, pattern: "tramo-*", merge-multiple: true }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Unir tramos (sin recodificar) + audio aac 320k
        run: |
          cd piezas
          ls tramo-*.mp4 | sort | sed "s/.*/file '&'/" > lista.txt
          cat lista.txt
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i lista.txt -c copy video-mudo.mp4
          ffmpeg -hide_banner -loglevel error -i video-mudo.mp4 -i ../ep5-redes.wav -map 0:v -map 1:a -c:v copy \
            -c:a aac -b:a 320k -shortest -movflags +faststart "../$SALIDA"
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate,nb_frames -of compact "../$SALIDA"
      - uses: actions/upload-artifact@v5
        with: { name: final, path: "${{ env.SALIDA }}", retention-days: 7, compression-level: 0 }
